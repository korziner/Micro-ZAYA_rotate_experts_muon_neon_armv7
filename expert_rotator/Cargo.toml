[package]
name = "expert_rotator"
version = "0.1.0"
edition = "2021"

[lib]
name = "expert_rotator"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
~/deb/nocuda $ cat  expert_rotator/pyproject.toml
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "expert_rotator"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
