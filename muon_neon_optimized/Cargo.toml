[package]
name = "muon_neon_optimized"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "muon_neon_optimized"

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rayon = "1.12"
ndarray = { version = "0.17", features = ["blas"] }
blas-src = { version = "0.14", default-features = false, features = ["openblas"] }
openblas-src = { version = "0.10", default-features = false, features = ["system"] }

[features]
nightly = []
blas = ["ndarray/blas"]  

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
